<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - AI导诊系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        .login-box {
            background: white; border-radius: 16px; padding: 36px;
            width: 400px; max-width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo-icon { font-size: 48px; }
        .logo h1 { font-size: 20px; color: #1a1a2e; margin-top: 8px; }
        .logo p { font-size: 13px; color: #888; margin-top: 4px; }
        .tab-bar {
            display: flex; border-radius: 8px; overflow: hidden;
            border: 1.5px solid #eee; margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1; padding: 10px; text-align: center; cursor: pointer;
            font-size: 13px; font-weight: 500; border: none;
            background: white; color: #888; transition: all 0.2s;
        }
        .tab-btn.active { background: #667eea; color: white; }
        .tab-btn:hover:not(.active) { background: #f5f3ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 13px; color: #555;
            margin-bottom: 5px; font-weight: 500;
        }
        .form-group input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #ddd;
            border-radius: 8px; font-size: 14px; transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .input-with-btn {
            display: flex; gap: 8px;
        }
        .input-with-btn input { flex: 1; }
        .input-with-btn button {
            padding: 11px 14px; background: #667eea; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 13px; white-space: nowrap; transition: all 0.2s;
        }
        .input-with-btn button:hover { background: #5a6fd6; }
        .input-with-btn button:disabled { background: #ccc; cursor: not-allowed; }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; transition: all 0.2s; margin-top: 4px;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102,126,234,0.3); }
        .error {
            background: #fce8e6; color: #d93025; padding: 10px 14px;
            border-radius: 8px; font-size: 13px; margin-bottom: 16px;
            text-align: center;
        }
        .links { text-align: center; margin-top: 16px; }
        .links a { color: #667eea; text-decoration: none; font-size: 13px; margin: 0 6px; }
        .links a:hover { text-decoration: underline; }
        .tip { font-size: 12px; color: #999; margin-top: 4px; }
        .setup-notice {
            background: #fff3cd; color: #856404; padding: 12px 16px;
            border-radius: 8px; font-size: 13px; margin-bottom: 16px;
            text-align: center; border: 1px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <div class="logo-icon">🔐</div>
            <h1>管理端登录</h1>
            <p>AI导诊系统 · 后台管理</p>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        {% if not has_users %}
        <div class="setup-notice">
            🚀 暂无管理员账号，<a href="/register" style="color:#856404;font-weight:600;">立即注册</a> 成为首位管理员
        </div>
        {% endif %}

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('password')">密码登录</button>
        </div>

        <!-- 密码登录 -->
        <div id="tab-password" class="tab-content active">
            <form method="POST" action="/admin/login">
                <input type="hidden" name="login_type" value="password">
                <div class="form-group">
                    <label>账号 / 手机号</label>
                    <input type="text" name="username" placeholder="请输入用户名或手机号" required autofocus>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn">登 录</button>
            </form>
        </div>

        <div class="links">
            <a href="/register">📝 注册新账号</a>
            <a href="/">🏠 返回首页</a>
        </div>
    </div>

    <script>
        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
            document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
            document.getElementById('tab-' + name).classList.add('active');
            document.querySelector('.tab-btn[onclick*="' + name + '"]').classList.add('active');
        }
    </script>
</body>
</html>
