<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员注册 - AI导诊系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        .register-box {
            background: white; border-radius: 16px; padding: 36px;
            width: 420px; max-width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo-icon { font-size: 48px; }
        .logo h1 { font-size: 20px; color: #1a1a2e; margin-top: 8px; }
        .logo p { font-size: 13px; color: #888; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 13px; color: #555;
            margin-bottom: 5px; font-weight: 500;
        }
        .form-group input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #ddd;
            border-radius: 8px; font-size: 14px; transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .input-with-btn {
            display: flex; gap: 8px;
        }
        .input-with-btn input { flex: 1; }
        .input-with-btn button {
            padding: 11px 14px; background: #667eea; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 13px; white-space: nowrap; transition: all 0.2s;
        }
        .input-with-btn button:hover { background: #5a6fd6; }
        .input-with-btn button:disabled { background: #ccc; cursor: not-allowed; }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; transition: all 0.2s; margin-top: 8px;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102,126,234,0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .error {
            background: #fce8e6; color: #d93025; padding: 10px 14px;
            border-radius: 8px; font-size: 13px; margin-bottom: 16px;
            text-align: center;
        }
        .success {
            background: #e6f4ea; color: #1e8e3e; padding: 10px 14px;
            border-radius: 8px; font-size: 13px; margin-bottom: 16px;
            text-align: center;
        }
        .links {
            text-align: center; margin-top: 16px;
        }
        .links a {
            color: #667eea; text-decoration: none; font-size: 13px;
        }
        .links a:hover { text-decoration: underline; }
        .tip {
            font-size: 12px; color: #999; margin-top: 4px;
        }
        .required::after {
            content: " *"; color: #d93025;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <div class="logo">
            <div class="logo-icon">📝</div>
            <h1>管理员注册</h1>
            <p>AI导诊系统 · 创建管理账号</p>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="success">{{ success }}</div>
        <div class="links">
            <a href="/admin/login">→ 前往登录</a> ·
            <a href="/">返回首页</a>
        </div>
        {% else %}
        <form method="POST" action="/admin/register" id="registerForm">
            <div class="form-group">
                <label class="required">管理员账号</label>
                <input type="text" name="username" id="username" placeholder="至少2个字符，字母或数字" required minlength="2"
                       onblur="checkUsername(this.value)">
                <div class="tip" id="usernameTip"></div>
            </div>
            <div class="form-group">
                <label class="required">登录密码</label>
                <input type="password" name="password" placeholder="至少6个字符" required minlength="6">
            </div>
            <div class="form-group">
                <label class="required">确认密码</label>
                <input type="password" name="password2" placeholder="再次输入密码" required minlength="6">
            </div>
            <button type="submit" class="btn" id="submitBtn">立即注册</button>
        </form>
        <div class="links">
            <a href="/admin/login">已有账号？去登录 →</a> ·
            <a href="/">返回首页</a>
        </div>
        {% endif %}
    </div>

    <script>
        function checkUsername(val) {
            var tip = document.getElementById('usernameTip');
            if (!val || val.length < 2) {
                tip.textContent = '';
                return;
            }
            fetch('/api/admin/check_username', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: val})
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.available) {
                    tip.textContent = '✅ 用户名可用';
                    tip.style.color = '#1e8e3e';
                } else {
                    tip.textContent = '❌ 用户名已被注册';
                    tip.style.color = '#d93025';
                }
            }).catch(function(){ /* 用户名检查失败不阻塞注册 */ });
        }
    </script>
</body>
</html>
