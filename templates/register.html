<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 - AI导诊系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #0f0c29, #1a1a3e, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { background: rgba(30,27,75,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(99,102,241,0.3); border-radius: 20px; padding: 40px; width: 420px; max-width: 92vw; }
        .box h2 { font-size: 22px; color: #c7d2fe; text-align: center; margin-bottom: 4px; }
        .box .sub { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 20px; }
        
        /* 角色切换 */
        .role-switch { display: flex; margin-bottom: 24px; background: rgba(15,12,41,0.6); border-radius: 10px; overflow: hidden; }
        .role-switch button { flex: 1; padding: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; color: #64748b; background: transparent; }
        .role-switch button.active { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; }
        .role-switch button:first-child { border-radius: 10px 0 0 10px; }
        .role-switch button:last-child { border-radius: 0 10px 10px 0; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid rgba(99,102,241,0.3); border-radius: 10px; background: rgba(15,12,41,0.6); color: #e2e8f0; font-size: 14px; outline: none; transition: all 0.2s; }
        .form-group input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        
        .sms-row { display: flex; gap: 8px; }
        .sms-row input { flex: 1; }
        .sms-btn { padding: 10px 14px; background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); border-radius: 10px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .sms-btn:hover { background: rgba(99,102,241,0.35); }
        .sms-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-user { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-user:hover { background: linear-gradient(135deg, #4ade80, #22c55e); }
        .btn-admin { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .btn-admin:hover { background: linear-gradient(135deg, #818cf8, #6366f1); }
        
        .links { text-align: center; margin-top: 18px; font-size: 12px; color: #64748b; }
        .links a { color: #818cf8; text-decoration: none; margin: 0 6px; }
        .links a:hover { text-decoration: underline; }
        
        .error { background: rgba(239,68,68,0.15); color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 14px; text-align: center; }
        .success { background: rgba(34,197,94,0.15); color: #4ade80; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 14px; text-align: center; }
        
        .msg { background: rgba(34,197,94,0.15); color: #4ade80; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 14px; text-align: center; }
    </style>
</head>
<body>
<div class="box">
    <h2>📝 注册账号</h2>
    <div class="sub">AI导诊系统</div>
    
    <div class="role-switch">
        <button id="tabUser" class="active" onclick="switchRole('user')">👤 普通用户</button>
        <button id="tabAdmin" onclick="switchRole('admin')">🔐 管理员</button>
    </div>
    
    {% if error %}<div class="error">❌ {{ error }}</div>{% endif %}
    {% if msg %}<div class="msg">✅ {{ msg }}</div>{% endif %}
    
    <!-- 普通用户表单 -->
    <form id="formUser" method="POST" action="/user/register">
        <div class="form-group"><label>用户名</label><input type="text" name="username" placeholder="2-16个字符" required></div>
        <div class="form-group"><label>密码</label><input type="password" name="password" placeholder="至少4个字符" required></div>
        <div class="form-group"><label>确认密码</label><input type="password" name="password2" placeholder="再次输入密码" required></div>
        <button type="submit" class="btn btn-user">👤 注册普通用户</button>
    </form>
    
    <!-- 管理员表单（默认隐藏） -->
    <form id="formAdmin" method="POST" action="/admin/register" style="display:none;">
        <div class="form-group"><label>用户名</label><input type="text" name="username" placeholder="2-16个字符" required></div>
        <div class="form-group"><label>密码</label><input type="password" name="password" placeholder="至少6个字符" required></div>
        <div class="form-group"><label>确认密码</label><input type="password" name="password2" placeholder="再次输入密码" required></div>
        <button type="submit" class="btn btn-admin">🔐 注册管理员</button>
    </form>
    
    <div class="links">
        <a href="/user/login">已有账号？登录</a> · <a href="/">返回首页</a>
    </div>
</div>

<script>
function switchRole(role) {
    var tabU = document.getElementById('tabUser');
    var tabA = document.getElementById('tabAdmin');
    var formU = document.getElementById('formUser');
    var formA = document.getElementById('formAdmin');
    if (role === 'user') {
        tabU.classList.add('active'); tabA.classList.remove('active');
        formU.style.display = ''; formA.style.display = 'none';
    } else {
        tabA.classList.add('active'); tabU.classList.remove('active');
        formA.style.display = ''; formU.style.display = 'none';
    }
}

</script>
</body>
</html>
