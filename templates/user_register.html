<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - AI导诊系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #0f0c29, #1a1a3e, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-box { background: rgba(30,27,75,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(99,102,241,0.3); border-radius: 20px; padding: 40px; width: 380px; max-width: 90vw; }
        .register-box h2 { font-size: 24px; color: #c7d2fe; text-align: center; margin-bottom: 4px; }
        .register-box .sub { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid rgba(99,102,241,0.3); border-radius: 10px; background: rgba(15,12,41,0.6); color: #e2e8f0; font-size: 14px; outline: none; transition: all 0.2s; }
        .form-group input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: linear-gradient(135deg, #4ade80, #22c55e); }
        .links { text-align: center; margin-top: 18px; font-size: 12px; color: #64748b; }
        .links a { color: #818cf8; text-decoration: none; margin: 0 8px; }
        .links a:hover { text-decoration: underline; }
        .error { background: rgba(239,68,68,0.15); color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 14px; text-align: center; }
        .success { background: rgba(34,197,94,0.15); color: #4ade80; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 14px; text-align: center; }
    </style>
</head>
<body>
<div class="register-box">
    <h2>📝 用户注册</h2>
    <div class="sub">AI导诊系统 · 创建账号</div>
    {% if error %}<div class="error">❌ {{ error }}</div>{% endif %}
    {% if msg %}<div class="success">✅ {{ msg }}</div>{% endif %}
    <form method="POST">
        <div class="form-group"><label>用户名</label><input type="text" name="username" placeholder="请输入用户名（至少2个字符）" required></div>
        <div class="form-group"><label>密码</label><input type="password" name="password" placeholder="请输入密码（至少4个字符）" required></div>
        <div class="form-group"><label>确认密码</label><input type="password" name="password2" placeholder="请再次输入密码" required></div>
        <button type="submit" class="btn">注 册</button>
    </form>
    <div class="links"><a href="/user/login">已有账号？登录</a> · <a href="/">返回首页</a></div>
</div>
</body>
</html>
