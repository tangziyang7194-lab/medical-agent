<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习成果 - AI导诊系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #e8f0fe 100%);
            min-height: 100vh; color: #333;
        }
        .container { max-width: 750px; margin: 0 auto; padding: 20px; }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; padding: 20px; border-radius: 16px;
            margin-bottom: 16px; text-align: center;
        }
        .header h2 { font-size: 18px; }
        .header .sub { font-size: 12px; opacity: 0.85; }
        .back { text-align: center; margin-bottom: 12px; }
        .back a { color: #667eea; text-decoration: none; font-size: 13px; margin: 0 8px; }
        .card {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px;
        }
        .card-title {
            font-size: 14px; font-weight: 600; color: #667eea; margin-bottom: 10px;
            padding-bottom: 8px; border-bottom: 2px solid #667eea;
        }
        .log-item {
            border: 1px solid #f0f0f0; border-radius: 8px; margin-bottom: 8px;
            overflow: hidden;
        }
        .log-header {
            padding: 10px 14px; background: #fafafa; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; font-weight: 500;
        }
        .log-header:hover { background: #f5f3ff; }
        .log-time { color: #999; font-size: 12px; font-weight: normal; }
        .log-body {
            padding: 14px; font-size: 12px; line-height: 1.6;
            display: none; border-top: 1px solid #f0f0f0;
            white-space: pre-wrap; background: #fcfcfc;
            font-family: "Courier New", monospace; color: #555;
            max-height: 400px; overflow-y: auto;
        }
        .log-body.open { display: block; }
        .arrow { transition: transform 0.2s; font-size: 10px; color: #999; }
        .arrow.down { transform: rotate(90deg); display: inline-block; }
        .empty {
            text-align: center; padding: 40px; color: #ccc; font-size: 13px;
        }
        .footer { text-align: center; padding: 20px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📜 学习成果与历史记录</h2>
        <div class="sub">每次手动或自动学习的完整输出</div>
    </div>
    <div class="back">
        <a href="/">🏠 首页</a>
        <a href="/learning">🧠 返回学习中心</a>
        <a href="/records">📋 病历记录</a>
    </div>

    {% if not logs %}
    <div class="card empty">暂无学习记录。点击「立即执行一次学习」开始。</div>
    {% else %}
        {% for log in logs %}
        <div class="card log-item">
            <div class="log-header" onclick="toggleNext(this)">
                <div>
                    <span>📄 {{ log.file[:30] }}...</span>
                    <span class="log-time">{{ log.time }}</span>
                </div>
                <span class="arrow">▶</span>
            </div>
            <div class="log-body">
{{ log.content }}
            </div>
        </div>
        {% endfor %}
    {% endif %}

    <div class="footer">AI 导诊系统 · DeepSeek V4 驱动</div>
</div>

<script>
function toggleNext(el) {
    var body = el.nextElementSibling;
    var arrow = el.querySelector('.arrow');
    if (body) {
        body.classList.toggle('open');
        if (arrow) arrow.classList.toggle('down');
    }
}
</script>
</body>
</html>
